openapi: 3.1.0
info:
  title: SocialMedia HTTP Contracts
  version: 1.0.0
  description: |
    Versioned public and private-network REST contracts. Public `/api/v1` routes are exposed
    by Gateway; `/internal/v1` routes are never routed by Gateway. Every response returns
    `X-Correlation-Id`. Protected operations derive the actor from JWT `sub`.
servers:
  - url: http://localhost:8080
    description: Local API Gateway
tags:
  - name: User
  - name: Post
  - name: Follow
  - name: Timeline
  - name: Notification
  - name: Internal
paths:
  /api/v1/auth/register:
    post:
      tags: [User]
      operationId: register
      summary: Register one account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/auth/login:
    post:
      tags: [User]
      operationId: login
      summary: Authenticate without revealing which credential was wrong
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed credential issued
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/users/me:
    get:
      tags: [User]
      operationId: getOwnAccount
      summary: Get the authenticated account without password data
      responses:
        '200':
          description: Authenticated account
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountView'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/profiles/{username}:
    parameters:
      - $ref: '#/components/parameters/Username'
    get:
      tags: [User]
      operationId: getPublicProfile
      summary: Compose User fields with exact Follow and Post counts
      security: []
      responses:
        '200':
          description: Public profile
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfile'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/posts:
    post:
      tags: [Post]
      operationId: createPost
      summary: Create an immutable original post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: Post committed with its outbox event
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/posts/{postId}:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      tags: [Post]
      operationId: getPost
      summary: Get a visible post
      security: []
      responses:
        '200':
          description: Visible post
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostView'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Post]
      operationId: deletePost
      summary: Soft-delete a post as its author
      responses:
        '204':
          description: Deleted or already deleted
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/posts/{postId}/likes/me:
    parameters:
      - $ref: '#/components/parameters/PostId'
    put:
      tags: [Post]
      operationId: likePost
      summary: Idempotently like a visible post as the JWT subject
      responses:
        '200':
          description: Like exists; count reflects the unique row
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/posts/{parentPostId}/replies:
    parameters:
      - name: parentPostId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UuidV7'
    post:
      tags: [Post]
      operationId: createReply
      summary: Create a post with a direct visible parent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: Reply committed with one post-published outbox event
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/users/{userId}/posts:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Size'
    get:
      tags: [Post]
      operationId: listUserPosts
      summary: List visible authored posts using a stable keyset
      security: []
      responses:
        '200':
          description: Post page
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostPage'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/follows/{followedUserId}:
    parameters:
      - name: followedUserId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UuidV7'
    put:
      tags: [Follow]
      operationId: followUser
      summary: Idempotently create the JWT subject's directional edge
      responses:
        '200':
          description: Relationship already existed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowView'
        '201':
          description: Relationship created with its outbox event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [Follow]
      operationId: unfollowUser
      summary: Idempotently remove the JWT subject's directional edge
      responses:
        '204':
          description: Relationship is absent
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/timeline/home:
    parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Size'
    get:
      tags: [Timeline]
      operationId: getHomeTimeline
      summary: Read precomputed references and hydrate through one bulk Post call
      responses:
        '200':
          description: Stable newest-first timeline page
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/notifications:
    parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Size'
    get:
      tags: [Notification]
      operationId: getNotifications
      summary: Get only the JWT subject's notifications
      responses:
        '200':
          description: Stable newest-first notification page
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /internal/v1/users/{userId}/exists:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Internal, User]
      operationId: userExists
      summary: Private-network user existence query
      servers:
        - url: http://user-service
      security: []
      responses:
        '200':
          description: Existence result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExistsResult'
  /internal/v1/users/{userId}/follow-counts:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Internal, Follow]
      operationId: getFollowCounts
      summary: Private-network exact follower/following counts
      servers:
        - url: http://follow-service
      security: []
      responses:
        '200':
          description: Exact counts from Follow owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowCounts'
  /internal/v1/users/{userId}/followers:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - name: eligibleAt
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Size'
    get:
      tags: [Internal, Follow]
      operationId: listEligibleFollowers
      summary: Page current followers whose relationship began by eligibleAt
      servers:
        - url: http://follow-service
      security: []
      responses:
        '200':
          description: Eligible follower IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowerPage'
        '400':
          $ref: '#/components/responses/BadRequest'
  /internal/v1/users/{userId}/post-count:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Internal, Post]
      operationId: getPostCount
      summary: Private-network count of visible authored posts
      servers:
        - url: http://post-service
      security: []
      responses:
        '200':
          description: Exact count from Post owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostCount'
  /internal/v1/posts/bulk:
    post:
      tags: [Internal, Post]
      operationId: bulkGetPosts
      summary: Return visible summaries for at most 100 IDs
      servers:
        - url: http://post-service
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkPostRequest'
      responses:
        '200':
          description: Unordered visible summaries; caller restores order and derives deletion availability from viewer/author IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkPostResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    CorrelationId:
      description: Request correlation ID accepted or generated by Gateway
      schema:
        type: string
        minLength: 1
        maxLength: 128
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UuidV7'
    PostId:
      name: postId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UuidV7'
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 30
        pattern: '^[A-Za-z0-9_]+$'
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque Base64URL versioned keyset; omit for first page
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Validation or malformed cursor failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, expired, malformed, or invalid credential
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated user does not own the requested action
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource is absent or unavailable because it was deleted
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Case-insensitive username or email conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: Required owning service did not answer within the bounded policy
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    UuidV7:
      type: string
      format: uuid
      description: RFC 9562 UUID version 7 generated by the owning service
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, username, displayName, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[A-Za-z0-9_]+$'
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        bio:
          type: string
          maxLength: 160
        password:
          type: string
          format: password
          minLength: 12
          description: Maximum 72 UTF-8 bytes; never logged or returned
    LoginRequest:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login:
          type: string
          description: Case-insensitive username or email
        password:
          type: string
          format: password
    TokenResponse:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresAt]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresAt:
          type: string
          format: date-time
    AccountView:
      type: object
      additionalProperties: false
      required: [id, email, username, displayName, bio, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/UuidV7'
        email:
          type: string
          format: email
        username:
          type: string
        displayName:
          type: string
        bio:
          type: string
        createdAt:
          type: string
          format: date-time
    PublicProfile:
      type: object
      additionalProperties: false
      required: [id, username, displayName, bio, followerCount, followingCount, postCount]
      properties:
        id:
          $ref: '#/components/schemas/UuidV7'
        username:
          type: string
        displayName:
          type: string
        bio:
          type: string
        followerCount:
          type: integer
          format: int64
          minimum: 0
        followingCount:
          type: integer
          format: int64
          minimum: 0
        postCount:
          type: integer
          format: int64
          minimum: 0
    CreatePostRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 280
          description: 1-280 Unicode code points and not whitespace-only; stored exactly
    ParentReference:
      type: object
      additionalProperties: false
      required: [postId, available]
      properties:
        postId:
          $ref: '#/components/schemas/UuidV7'
        available:
          type: boolean
    PostView:
      type: object
      additionalProperties: false
      required: [id, authorId, text, publishedAt, reply, likeCount, deletionAvailable]
      properties:
        id:
          $ref: '#/components/schemas/UuidV7'
        authorId:
          $ref: '#/components/schemas/UuidV7'
        text:
          type: string
        publishedAt:
          type: string
          format: date-time
        reply:
          type: boolean
        parent:
          oneOf:
            - $ref: '#/components/schemas/ParentReference'
            - type: 'null'
        likeCount:
          type: integer
          format: int64
          minimum: 0
        deletionAvailable:
          type: boolean
          description: True only when the authenticated viewer is the author
    PostSummary:
      type: object
      additionalProperties: false
      required: [id, authorId, text, publishedAt, reply, likeCount]
      properties:
        id:
          $ref: '#/components/schemas/UuidV7'
        authorId:
          $ref: '#/components/schemas/UuidV7'
        text:
          type: string
        publishedAt:
          type: string
          format: date-time
        reply:
          type: boolean
        parent:
          oneOf:
            - $ref: '#/components/schemas/ParentReference'
            - type: 'null'
        likeCount:
          type: integer
          format: int64
          minimum: 0
    LikeResult:
      type: object
      additionalProperties: false
      required: [postId, liked, likeCount]
      properties:
        postId:
          $ref: '#/components/schemas/UuidV7'
        liked:
          type: boolean
          const: true
        likeCount:
          type: integer
          format: int64
          minimum: 1
    PostPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PostView'
        nextCursor:
          type: [string, 'null']
    FollowView:
      type: object
      additionalProperties: false
      required: [id, followerId, followedId, followedAt]
      properties:
        id:
          $ref: '#/components/schemas/UuidV7'
        followerId:
          $ref: '#/components/schemas/UuidV7'
        followedId:
          $ref: '#/components/schemas/UuidV7'
        followedAt:
          type: string
          format: date-time
    NotificationView:
      type: object
      additionalProperties: false
      required: [id, type, actorUserId, subjectId, eventTime, availableAt]
      properties:
        id:
          $ref: '#/components/schemas/UuidV7'
        type:
          type: string
          enum: [FOLLOW, REPLY]
        actorUserId:
          $ref: '#/components/schemas/UuidV7'
        subjectId:
          $ref: '#/components/schemas/UuidV7'
        parentPostId:
          oneOf:
            - $ref: '#/components/schemas/UuidV7'
            - type: 'null'
        eventTime:
          type: string
          format: date-time
        availableAt:
          type: string
          format: date-time
    NotificationPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationView'
        nextCursor:
          type: [string, 'null']
    ExistsResult:
      type: object
      additionalProperties: false
      required: [exists]
      properties:
        exists:
          type: boolean
    FollowCounts:
      type: object
      additionalProperties: false
      required: [followerCount, followingCount]
      properties:
        followerCount:
          type: integer
          format: int64
          minimum: 0
        followingCount:
          type: integer
          format: int64
          minimum: 0
    FollowerPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UuidV7'
        nextCursor:
          type: [string, 'null']
    PostCount:
      type: object
      additionalProperties: false
      required: [postCount]
      properties:
        postCount:
          type: integer
          format: int64
          minimum: 0
    BulkPostRequest:
      type: object
      additionalProperties: false
      required: [postIds]
      properties:
        postIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/UuidV7'
    BulkPostResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          description: Visible posts only; order is not guaranteed
          items:
            $ref: '#/components/schemas/PostSummary'
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        correlationId:
          type: string
security:
  - bearerAuth: []
