spring:
  application:
    name: ${SPRING_APPLICATION_NAME:api-gateway}
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true
    banner-mode: "off"
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:./secrets/jwt-public.pem}
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      server:
        webmvc:
          routes:
            - id: user-auth-and-profile
              uri: lb://user-service
              predicates:
                - Path=/api/v1/auth/**,/api/v1/profiles/**,/api/v1/users/me
            - id: post-public-and-write
              uri: lb://post-service
              predicates:
                - Path=/api/v1/posts/**,/api/v1/users/*/posts
            - id: follow
              uri: lb://follow-service
              predicates:
                - Path=/api/v1/follows/**
            - id: timeline
              uri: lb://timeline-service
              predicates:
                - Path=/api/v1/timeline/**
            - id: notification
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notifications/**

server:
  port: ${SERVER_PORT:8080}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

security:
  jwt:
    issuer: ${JWT_ISSUER:socialmedia-user-service}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:./secrets/jwt-public.pem}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
