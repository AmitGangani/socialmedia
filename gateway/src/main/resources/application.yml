spring:
  application:
    name: ${SPRING_APPLICATION_NAME:api-gateway}
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true
    banner-mode: "off"
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:./secrets/jwt-public.pem}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-auth-and-profile
              uri: ${USER_SERVICE_URL:http://user-service:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/profiles/**,/api/v1/users/me
            - id: post-public-and-write
              uri: ${POST_SERVICE_URL:http://post-service:8082}
              predicates:
                - Path=/api/v1/posts/**,/api/v1/users/*/posts
            - id: follow
              uri: ${FOLLOW_SERVICE_URL:http://follow-service:8083}
              predicates:
                - Path=/api/v1/follows/**
            - id: timeline
              uri: ${TIMELINE_SERVICE_URL:http://timeline-service:8084}
              predicates:
                - Path=/api/v1/timeline/**
            - id: notification
              uri: ${NOTIFICATION_SERVICE_URL:http://notification-service:8085}
              predicates:
                - Path=/api/v1/notifications/**

server:
  port: ${SERVER_PORT:8080}

security:
  jwt:
    issuer: ${JWT_ISSUER:socialmedia-user-service}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:./secrets/jwt-public.pem}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
