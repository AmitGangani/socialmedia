spring:
  application:
    name: ${SPRING_APPLICATION_NAME:timeline-service}
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true
    banner-mode: "off"
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/timeline_db}
    username: ${SPRING_DATASOURCE_USERNAME:timeline_service}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me-timeline}
    hikari:
      connection-timeout: 2000
  flyway:
    enabled: true
    validate-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:./secrets/jwt-public.pem}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: timeline-service-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true

server:
  port: ${SERVER_PORT:8084}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

security:
  jwt:
    issuer: ${JWT_ISSUER:socialmedia-user-service}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:./secrets/jwt-public.pem}

clients:
  connect-timeout: 2s
  read-timeout: 2s
  follow-service:
    base-url: http://follow-service
  post-service:
    base-url: http://post-service

resilience4j:
  circuitbreaker:
    instances:
      timeline-post-bulk:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 1

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
